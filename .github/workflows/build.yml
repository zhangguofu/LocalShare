# LocalShare 自动构建与发布
# - push 到 main / 手动触发：构建 + 测试 + 上传产物（Artifact）
# - 打 v* 标签（如 v1.2.3）：构建 + 测试 + 发布到 GitHub Release
# 平台：macOS（.dmg）+ Windows（.exe），各自原生 runner，无需交叉编译
name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-13 = Intel(x64)；macos-latest = Apple Silicon(arm64)；windows-latest = x64
        os: [macos-13, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # 发布 Release 需要（tag 触发时）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # 严格按 package-lock.json 安装（可复现 + 更快 + lock 不一致时提前报错）
        # 走仓库 .npmrc（npmmirror 镜像，含 Electron 二进制与 electron-builder 工具链）
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (electron-vite)
        # 关键：先生成 out/ 目录，electron-builder 打包的是 out/main/index.js
        run: npm run build

      - name: Build & package
        # tag 触发 → 发布到 Release；否则仅打包
        run: npx electron-builder --publish "${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}"
        env:
          # 签名证书（存入 GitHub Secrets 后自动启用；未配置则跳过签名）
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # CI 无本机证书库：禁用自动发现，避免 mac runner 误判签名
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        # 非 tag 触发时上传产物供下载/调试
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: localshare-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
