# LocalShare 自动构建与发布
# - push 到 main / 手动触发：构建 + 测试 + 上传产物（Artifact）
# - 打 v* 标签（如 v1.2.3）：构建 + 测试 + 发布到 GitHub Release
# 平台：macOS（.dmg）+ Windows（.exe），各自原生 runner，无需交叉编译
name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # GitHub 已移除 Intel runner（macos-13 下线）：mac 在 arm64 runner 上交叉打 x64 + arm64
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # 发布 Release 需要（tag 触发时）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # 严格按 package-lock.json 安装（可复现 + 更快 + lock 不一致时提前报错）
        # 走仓库 .npmrc（npmmirror 镜像，含 Electron 二进制与 electron-builder 工具链）
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (electron-vite)
        # 关键：先生成 out/ 目录，electron-builder 打包的是 out/main/index.js
        run: npm run build

      - name: Configure signing (conditional)
        # 仅当 Secrets 存在时注入签名环境变量；空 Secrets 不注入 → electron-builder 干净跳过签名
        shell: bash
        run: |
          if [ -n "${{ secrets.MAC_CSC_LINK }}" ]; then
            { echo 'CSC_LINK<<EOF'; echo "${{ secrets.MAC_CSC_LINK }}"; echo 'EOF'; } >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=${{ secrets.MAC_CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.WIN_CSC_LINK }}" ]; then
            { echo 'WIN_CSC_LINK<<EOF'; echo "${{ secrets.WIN_CSC_LINK }}"; echo 'EOF'; } >> "$GITHUB_ENV"
            echo "WIN_CSC_KEY_PASSWORD=${{ secrets.WIN_CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build & package
        # Windows runner 默认 PowerShell，显式指定 bash（git-bash 自带）
        shell: bash
        # tag 触发 → 发布到 Release；否则仅打包
        # macOS：在 arm64 runner 上交叉打包 x64 + arm64 两个 dmg（GitHub 无 Intel runner）
        run: |
          PUBLISH="${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            npx electron-builder --mac --x64 --arm64 --publish "$PUBLISH"
          else
            npx electron-builder --publish "$PUBLISH"
          fi
        env:
          # CI 无本机证书库：禁用自动发现；签名变量由上方条件步骤注入
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        # 非 tag 触发时上传产物供下载/调试
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: localshare-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
